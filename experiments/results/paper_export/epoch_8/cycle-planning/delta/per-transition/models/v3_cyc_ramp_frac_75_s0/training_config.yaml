output_model_name: v3_cyc_ramp_frac_75_s0
subdir: v3_cyc_ramp_frac_75_s0
run_group: cyc_ramp_frac_75
resume_policy: auto
num_workers: 6
train_split: 0.9
seed: 0
img_size: 224
embed_dim: 192
history_size: 3
label_frac: 0.75
label_seed: ${seed}
episode_key: episode_idx
step_key: step_idx
eval_epoch: 8
eval_output_dir: null
probe_num_batches: null
probe_train_fraction: 0.8
probe_alpha: 1.0
probe_seed: 0
conditioning: code
code_dim: 10
trainer:
  max_epochs: 10
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0
loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true
optimizer:
  type: AdamW
  lr: 5.0e-05
  weight_decay: 0.001
num_preds: 1
loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
  action_teacher:
    weight: 0.1
  cycle:
    ratio: 1.0
    warmup_epochs: 3
    ramp_epochs: 2
    space: action
wandb:
  enabled: true
  config:
    project: latent-jepa-experiment
    name: ${output_model_name}
    group: ${run_group}
    entity: amlrt
    id: ${subdir}
    resume: allow
    log_model: false
local_launcher: true
data:
  dataset:
    num_steps: ${eval:'${num_preds} + ${history_size}'}
    frameskip: 5
    name: /tmp/pusht_expert_train.h5
    keys_to_load:
    - pixels
    - action
    - proprio
    - state
    - step_idx
    - episode_idx
    keys_to_cache:
    - action
    - proprio
    - state
    - step_idx
    - episode_idx
model:
  _target_: jepa.JEPA
  conditioning: ${conditioning}
  detach_idm_inputs: false
  idm:
    _target_: module.IDM
    z_dim: ${embed_dim}
    code_dim: ${code_dim}
    hidden: 512
    code_bn: false
    out_act: null
  code_proj: null
  quantizer: null
  encoder:
    _target_: stable_pretraining.backbone.utils.vit_hf
    size: tiny
    patch_size: 14
    image_size: ${img_size}
    pretrained: false
    use_mask_token: false
  predictor:
    _target_: module.ARPredictor
    num_frames: ${history_size}
    input_dim: ${embed_dim}
    hidden_dim: ${embed_dim}
    output_dim: ${embed_dim}
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
  action_encoder:
    _target_: module.Embedder
    input_dim: 10
    emb_dim: ${embed_dim}
  projector:
    _target_: module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  pred_proj:
    _target_: module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
